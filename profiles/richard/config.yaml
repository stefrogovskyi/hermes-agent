compression:
  enabled: true
  threshold: 0.15
  target_ratio: 0.15
display:
  busy_input_mode: steer
  streaming: true
  interim_assistant_messages: false
  streaming_throttle_ms: 1000
  tool_progress: none
approvals:
  mode: manual
command_allowlist:
- access to Hermes secrets (Windows path)
- cat << 'EOF' > /root/cn_ff_1_outreach.py
- script execution via -e/-c flag
- python3 /root/cn_ff_1_outreach.py
- delete in root path
- write_file
- execute_code
onboarding:
  seen:
    busy_input_prompt: true
_config_version: 33
auto_tts: false
platforms:
  telegram:
    allow_from:
    - '*'
    - '330656040'
    - '8081511707'
    - '149598904'
    - '593209837'
    - '1022586369'
    - '386283612'
    - '345948971'
    enabled: true
    group_allow_from:
    - '*'
    require_mention: true
    home_channel:
      platform: telegram
      chat_id: '330656040'
    allow_admin_from:
    - '330656040'
    user_allowed_commands:
    - start
    - help
    - status
    - clear
    - new
    - info
request_timeout_seconds: 30
fallback: *id001
