group_sessions_per_user: true
model:
  default: google/gemini-3.7-flash
  max_retries: 2
  provider: google
  providers:
    gonka24:
      api_key_env: GONKA24_API_KEY
      base_url: https://api.gonka24.com/v1
      models:
      - minimax-m2.7
      - kimi-k2.6
  request_timeout_seconds: 30
  retry_delay_seconds: 1
onboarding:
  seen:
    busy_input_prompt: true
platforms:
  telegram:
    aliases:
    - callum
    - каллум
    - каллума
    - каллуму
    - каллумом
    - каллуме
    - каллум ванс
    - callum vance
    - '@callumvancebot'
    group_response_mode: mention
provider: google
providers:
  gonka24:
    request_timeout_seconds: 25
  google:
    request_timeout_seconds: 30
  nous:
    request_timeout_seconds: 30
  nvidia:
    request_timeout_seconds: 20
  openai:
    request_timeout_seconds: 30
  openrouter:
    request_timeout_seconds: 25
request_timeout_seconds: 15
streaming:
  enabled: true
telegram:
  allow_from: &id001
  - 330656040
  - 1022586369
  - 593209837
  allowed_users: *id001
  enabled: true
  group_trigger_keywords: '[''Каллум'', ''Каллума'', ''Каллуму'', ''Callum'']'
  require_mention: true
  stream_update_interval_ms: 2500
tools:
  disabled:
  - cronjob
  - skill_manage
