_config_version: 33
auto_tts: false
command_allowlist:
- Windows PowerShell destructive delete
- script execution via -e/-c flag
- delete in root path
- command parser limit or malformed executable payload
- execute_code
compression:
  enabled: true
  target_ratio: 0.1
  threshold: 0.2
display:
  busy_input_mode: steer
  interim_assistant_messages: true
  streaming: true
  streaming_throttle_ms: 1000
  tool_progress: all
fallback: &id001
- model: gpt-4o
  provider: openai
- model: deepseek/deepseek-chat
  provider: openrouter
- model: deepseek-ai/DeepSeek-R1
  provider: huggingface
- model: deepseek-ai/DeepSeek-V3
  provider: huggingface
- model: google/gemini-3.6-flash
  provider: google
- model: nousresearch/hermes-3-llama-3.1-405b
  provider: openrouter
- model: meta-llama/Llama-3.3-70B-Instruct
  provider: huggingface
- model: google/gemini-2.5-pro
  provider: google
- model: meta-llama/llama-3.3-70b-instruct
  provider: openrouter
- model: nousresearch/hermes-3-llama-3.1-70b
  provider: openrouter
- model: Qwen/Qwen2.5-72B-Instruct
  provider: huggingface
- model: qwen/qwen-2.5-72b-instruct
  provider: openrouter
- model: Qwen/Qwen2.5-Coder-32B-Instruct
  provider: huggingface
- model: mistralai/mistral-small-24b-instruct-2501
  provider: openrouter
- model: minimax-m2.7
  provider: gonka24
- model: kimi-k2.6
  provider: gonka24
- model: gpt-4o-mini
  provider: openai
- model: nvidia/nemotron-3-super-120b-a12b:free
  provider: openrouter
- model: google/gemma-4-31b-it:free
  provider: openrouter
- model: google/gemma-4-26b-a4b-it:free
  provider: openrouter
- model: minimax/minimax-m3:free
  provider: openrouter
- model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  provider: openrouter
- model: mistralai/mistral-nemo
  provider: openrouter
- model: meta-llama/Llama-3.1-8B-Instruct
  provider: huggingface
- model: google/gemini-2.5-flash
  provider: google
fallback_providers: *id001
model:
  default: google/gemini-3.7-flash
  max_retries: 2
  provider: google
  providers:
    gonka24:
      api_key_env: GONKA24_API_KEY
      base_url: https://api.gonka24.com/v1
      models:
      - minimax-m2.7
      - kimi-k2.6
    huggingface:
      api_key_env: HF_TOKEN
      base_url: https://router.huggingface.co/v1
      models:
      - deepseek-ai/DeepSeek-R1
      - deepseek-ai/DeepSeek-V3
      - meta-llama/Llama-3.3-70B-Instruct
      - Qwen/Qwen2.5-72B-Instruct
      - Qwen/Qwen2.5-Coder-32B-Instruct
      - meta-llama/Llama-3.1-8B-Instruct
  request_timeout_seconds: 30
  retry_delay_seconds: 1
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
platforms:
  telegram:
    aliases:
    - alistair
    - алистер
    - алистера
    - алистеру
    - алистером
    - алистере
    - алистер стерлинг
    - alistair sterling
    - '@qubicpmbot'
    group_response_mode: mention
provider: google
providers:
  gonka24:
    request_timeout_seconds: 25
  google:
    request_timeout_seconds: 30
  nous:
    request_timeout_seconds: 30
  nvidia:
    request_timeout_seconds: 20
  openai:
    request_timeout_seconds: 30
  openrouter:
    request_timeout_seconds: 25
request_timeout_seconds: 15
streaming:
  enabled: true
system_prompt_append: 'In Telegram group chats: respond ONLY if (1) @mentioned (@qubicpmbot),
  (2) directly replied/quoted to, or (3) your name (Алистер / Alistair / Алик) is
  explicitly mentioned in the text. If you are NOT addressed in one of these three
  ways, or if the question is directed to someone else (e.g. @lxxmngu, @PixelProphet),
  you MUST REMAIN COMPLETELY SILENT and output NO text.'
telegram:
  bot_token: 8738625022:AAG1ijTON2GaWu9stugzR45n-tx4ziwu3qQ
  enabled: true
  group_allow_from: '*'
  group_response_mode: mention
  group_trigger_keywords:
  - Алистер
  - Алистера
  - Алистеру
  - Алистером
  - Алистере
  - Алик
  - Alistair
  - Alister
  - Alistair Sterling
  - Alistair's
  mention_patterns:
  - \bалистер[а-я]*\b
  - \balistair\b
  - \balister\b
  - \bалик\b
  require_mention: true
  respond_to_dms: true
  stream_update_interval_ms: 2500
tools:
  disabled:
  - cronjob
  - skill_manage
voice: fable
