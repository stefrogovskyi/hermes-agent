compression:
  enabled: true
  threshold: 0.25
  target_ratio: 0.15
command_allowlist:
- overwrite system file via tee
- git force push (rewrites remote history)
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 34
owner_id: '330656040'
platforms:
  telegram:
    enabled: true
    require_mention: true
    home_channel:
      platform: telegram
      chat_id: '330656040'
    allow_admin_from:
    - '330656040'
    allow_from:
    - '*'
    - '330656040'
    group_allow_from:
    - '*'
request_timeout_seconds: 30
fallback: *id001
